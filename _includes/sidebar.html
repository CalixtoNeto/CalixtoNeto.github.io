<aside class="sidebar" id="sidebar">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="menu">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Início</a>
    <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} class="active"{% endif %}>Blog</a>
    <a href="{{ '/sobre/' | relative_url }}"{% if page.url == '/sobre/' %} class="active"{% endif %}>Sobre</a>
  </nav>

  {% assign series = site.posts | where_exp: "p", "p.serie" | sort: "ordem" %}
  {% if series.size > 0 %}
  <div class="toc">
    <h2>{{ series.first.serie }}</h2>
    <ol>
      {% for p in series %}
      <li{% if page.url == p.url %} class="active"{% endif %}>
        <a href="{{ p.url | relative_url }}">
          <span class="num">{{ p.ordem | prepend: '0' | slice: -2, 2 }}</span>
          <span class="t">{{ p.title }}</span>
        </a>
      </li>
      {% endfor %}
    </ol>
  </div>
  {% endif %}
</aside>
