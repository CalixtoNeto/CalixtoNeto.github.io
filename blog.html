---
layout: default
title: Blog
permalink: /blog/
---
<main class="pagina">
  <h1 class="subtitulo-pagina">Blog</h1>
  <ul class="posts">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">
        <span class="d">{{ post.date | date: "%d/%m/%Y" }}{% if post.serie %} · {{ post.serie }}{% endif %}</span>
        <h2>{{ post.title }}</h2>
        {% if post.description %}<p>{{ post.description }}</p>{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</main>
