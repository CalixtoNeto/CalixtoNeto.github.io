<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <button class="burger" aria-label="Menu" onclick="document.body.classList.toggle('open')">?</button>
  <div class="shell">
    {% include sidebar.html %}
    <main class="content">
      {{ content }}
      <footer class="footer">
        © {{ site.time | date: "%Y" }} {{ site.author.name }} ·
        <a href="https://github.com/{{ site.author.github }}">GitHub</a> ·
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </footer>
    </main>
  </div>
</body>
</html>
