<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="header">
    <a class="logo" href="{{ '/' | relative_url }}">Calixto<span class="logo-ponto">.</span></a>
    <nav class="header-menu">
      <a href="{{ '/' | relative_url }}#experiencia">Experiência</a>
      <a href="{{ '/' | relative_url }}#stack">Stack</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/curriculo/' | relative_url }}" class="menu-destaque">Currículo</a>
      <a href="{{ '/' | relative_url }}#contato">Contato</a>
    </nav>
  </header>

  {{ content }}

  <footer class="footer" id="contato">
    <div class="footer-container">
      <ul class="footer-contato">
        <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn ↗</a></li>
        <li><a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub ↗</a></li>
        <li><a href="{{ '/curriculo/' | relative_url }}">Currículo Completo ↗</a></li>
        <li class="footer-local">{{ site.author.location }}</li>
      </ul>
      <p class="footer-copy">© João Calixto Neto · Todos os direitos reservados. · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </footer>
</body>
</html>
